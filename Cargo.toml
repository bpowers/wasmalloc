[package]
name = "wasmalloc"
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A fast mimalloc-v3-style global allocator for single-threaded wasm32"
repository = "https://github.com/bpowers/wasm-clalloc"
keywords = ["allocator", "wasm", "webassembly", "no_std", "mimalloc"]
categories = ["memory-management", "no-std", "wasm"]
publish = false

[workspace]
members = ["."]
# bench/roofline keeps its own profiles and lockfile on purpose; fuzz needs nightly and
# libfuzzer-sys, which must not slow down or destabilise the main gate.
exclude = ["bench/roofline", "fuzz"]

[lib]
crate-type = ["rlib"]

[features]
# Pulls in std for the test helpers under `testing` (the model-based tester, the simulated
# memory Region). Never enable it in a #[global_allocator] build.
testing = []

[dependencies]

[dev-dependencies]
# Integration tests and doctests see the crate with the `testing` feature enabled; this
# self-dependency is the only way to turn a feature on for them alone.
wasmalloc = { path = ".", features = ["testing"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
